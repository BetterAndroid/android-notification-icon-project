name: Release Icon Resources

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-icon-resources:
    runs-on: ubuntu-latest
    concurrency:
      group: icon-resources-release
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Resolve Icon Resource Release
        id: release
        run: |
          resolved_sha=$(git rev-parse HEAD)
          tag="${resolved_sha:0:7}"
          echo "sha=$resolved_sha" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release $tag already exists; skipping."
            exit 0
          fi
          before_tag=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1 --json tagName --jq '.[0].tagName // empty')
          if [[ -z "$before_tag" ]]; then
            before_tag=$(git rev-parse --short=7 "$resolved_sha^")
          fi
          # A batch may end without icon changes, such as when the last submission was closed without merging.
          if git diff --quiet "$before_tag" "$resolved_sha" -- icons; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "No icon changes since $before_tag; skipping."
            exit 0
          fi
          echo "before_tag=$before_tag" >> "$GITHUB_OUTPUT"
          echo "exists=false" >> "$GITHUB_OUTPUT"

      - name: Prepare Icon Resource Release
        if: steps.release.outputs.exists == 'false'
        id: bundle
        env:
          BEFORE_TAG: ${{ steps.release.outputs.before_tag }}
          SHA: ${{ steps.release.outputs.sha }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          # Credits everyone whose icon changes landed since the previous release, in commit order.
          contributors=()
          add_contributor() {
            local name
            for name in "$@"; do
              [[ -z "$name" || "$name" == *'[bot]' || " ${contributors[*]} " == *" @$name "* ]] && continue
              contributors+=("@$name")
            done
          }
          while IFS= read -r commit; do
            # An automated submission credits the user who opened its issue.
            issue_number=$(gh api "repos/$GITHUB_REPOSITORY/commits/$commit/pulls" --jq \
              '.[] | select(.head.repo.full_name == env.GITHUB_REPOSITORY and (.head.ref | test("^anip/submit-[0-9]+$"))) | .head.ref | ltrimstr("anip/submit-")' | head -n 1)
            if [[ -n "$issue_number" ]]; then
              add_contributor "$(gh api "repos/$GITHUB_REPOSITORY/issues/$issue_number" --jq '.user.login')"
              continue
            fi
            # Other commits credit the users mentioned in the commit message, such as "by @name".
            mentions=$(git log -1 --format=%B "$commit" | grep -oE '(^|[[:space:](])@[A-Za-z0-9](-?[A-Za-z0-9])*' | sed 's/.*@//' || true)
            if [[ -n "$mentions" ]]; then
              # GitHub usernames contain no spaces, so the list can be split on whitespace.
              add_contributor $mentions
              continue
            fi
            add_contributor "$(gh api "repos/$GITHUB_REPOSITORY/commits/$commit" --jq '.author.login // empty')"
          done < <(git log --reverse --format=%H "$BEFORE_TAG..$SHA" -- icons)
          archive="$RUNNER_TEMP/anip-bundle-$TAG.zip"
          (
            cd icons
            zip -qr "$archive" app game system
          )
          asset_name="anip-bundle-$TAG.zip"
          manifest="$RUNNER_TEMP/anip-release.json"
          timestamp_seconds=$(git show -s --format=%ct "$SHA")
          timestamp=$((timestamp_seconds * 1000))
          size=$(stat -c%s "$archive")
          sha256=$(sha256sum "$archive" | cut -d ' ' -f1)
          download_url="$asset_name"
          jq -n \
            --argjson schemaVersion 1 \
            --arg tag "$TAG" \
            --argjson timestamp "$timestamp" \
            --arg assetName "$asset_name" \
            --arg downloadUrl "$download_url" \
            --argjson size "$size" \
            --arg sha256 "$sha256" \
            '{
              schemaVersion: $schemaVersion,
              tag: $tag,
              timestamp: $timestamp,
              assetName: $assetName,
              downloadUrl: $downloadUrl,
              size: $size,
              sha256: $sha256
            }' > "$manifest"
          {
            if [[ ${#contributors[@]} -gt 1 ]]; then
              printf -v joined '%s, ' "${contributors[@]}"
              echo "**Contributors**: ${joined%, }"
              echo
            elif [[ ${#contributors[@]} -eq 1 ]]; then
              echo "**Contributor**: ${contributors[0]}"
              echo
            fi
            echo "**Full Changelog**: https://github.com/$GITHUB_REPOSITORY/compare/$BEFORE_TAG...$TAG"
          } > "$RUNNER_TEMP/anip-release-notes.md"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "manifest=$manifest" >> "$GITHUB_OUTPUT"

      - name: Publish Icon Resource Release
        if: steps.release.outputs.exists == 'false'
        env:
          ARCHIVE: ${{ steps.bundle.outputs.archive }}
          MANIFEST: ${{ steps.bundle.outputs.manifest }}
          SHA: ${{ steps.release.outputs.sha }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          gh release create "$TAG" "$ARCHIVE" "$MANIFEST" --repo "$GITHUB_REPOSITORY" --target "$SHA" --title "$TAG" --notes-file "$RUNNER_TEMP/anip-release-notes.md" --latest